*{box-sizing:border-box}

.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{font:inherit;font-size:.85rem;background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:2px 10px;cursor:pointer}

#q{font:inherit;font-size:.85rem;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:3px 8px;min-width:0;flex:1 1 160px;max-width:240px}
.shown{font-size:.8rem;color:var(--sub);margin-left:auto}
.sec{margin-top:28px}
.sec h2{margin:0 0 4px;font-size:1.1rem}
.noart{display:grid;place-items:center;background:var(--chip);color:var(--sub);font-size:.75rem;aspect-ratio:250/190}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tag{font-size:.8rem;font-weight:600;line-height:1.5;padding:0 8px;border-radius:4px;background:var(--chip);border:1px solid var(--line);color:var(--text)}

.foot{margin-top:40px;font-size:.75rem;color:var(--sub)}

.tile{font:inherit;color:inherit;text-align:left;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile img,.tile .noart{width:100%;height:auto;aspect-ratio:250/190;border-radius:3px;display:block;transition:transform .12s}

.tname{font-weight:700;font-size:.9rem;line-height:1.35}
.tile .tag{font-size:.7rem;padding:0 6px}

span>","fx":"破滅 16\u003cspan class=\"up\">（強化 19）\u003c/span>を付与する。\u003cbr>この敵の破滅がHP以上なら、即座に倒す。"},{"name":"蛇神の顎","big":"img/l/serpent_god_jaw.jpg","meta":"\u003cspan class=\"tag t-attack\">アタック\u003c/span>\u003cspan class=\"tag\">コスト 2\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"8\u003cspan class=\"up\">（強化 13）\u003c/span>ダメージを与える。\u003cbr>この敵の毒を1.5倍（切り捨て）にする。\u003cbr>その後、この敵の破滅をすべて取り除き、その1/3（切り捨て）の毒を付与する。廃棄。"},{"name":"白蛇の一閃","big":"img/l/white_snake_flash.jpg","meta":"\u003cspan class=\"tag t-attack\">アタック\u003c/span>\u003cspan class=\"tag\">コスト 1\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"6\u003cspan class=\"up\">（強化 8）\u003c/span>ダメージを与える。\u003cbr>この敵が毒と破滅の両方を持っていれば、ダメージが3倍（18／強化 24）になる。"},{"name":"大祓","big":"img/l/oharae.jpg","meta":"\u003cspan class=\"tag t-attack\">アタック\u003c/span>\u003cspan class=\"tag\">コスト 2\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"すべての敵に 14\u003cspan class=\"up\">（強化 18）\u003c/span>ダメージを与える。\u003cbr>自分の脱力・弱体・脆弱を取り除く。"},{"name":"蛇の抱擁","big":"img/l/serpent_embrace.jpg","meta":"\u003cspan class=\"tag t-skill\">スキル\u003c/span>\u003cspan class=\"tag\">コスト 1\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"3\u003cspan class=\"up\">（強化 6）\u003c/span>ブロックに加え、すべての敵の破滅の合計の3分の1（切り捨て）のブロックを得る。\u003cbr>マルチでは破滅の部分だけ、破滅を使うプレイヤー（蛇の巫女・ネクロバインダー）の人数で割る。"},{"name":"鱗の鎧","big":"img/l/scale_armor.jpg","meta":"\u003cspan class=\"tag t-power\">パワー\u003c/span>\u003cspan class=\"tag\">コスト 1\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"ターン開始時、ブロックがすべて消えず、3分の1（切り捨て）残るようになる。\u003cbr>強化で半分残る。"},{"name":"アスクレピオスの杖","big":"img/l/asclepius_staff.jpg","meta":"\u003cspan class=\"tag t-skill\">スキル\u003c/span>\u003cspan class=\"tag\">コスト 3\u003cspan class=\"up\">（強化 2）\u003c/span>\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"すべての敵の毒の合計の1/2（切り捨て）だけ、HPを回復する。マルチではさらに、毒を使うプレイヤー（蛇の巫女・サイレント）の人数で割る。\u003cbr>廃棄。"},{"name":"毒走り","big":"img/l/venom_rush.jpg","meta":"\u003cspan class=\"tag t-skill\">スキル\u003c/span>\u003cspan class=\"tag\">コスト 1\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"すべての敵の毒を、今すぐ 1\u003cspan class=\"up\">（強化 2）\u003c/span>回発動させる（毒は減らない）。"},{"name":"形代","big":"img/l/katashiro.jpg","meta":"\u003cspan class=\"tag t-skill\">スキル\u003c/span>\u003cspan class=\"tag\">コスト 1\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"この敵の破滅の1/4（切り捨て）を取り除き、取り除いた分の半分（強化で全部）だけHPを回復する。\u003cbr>廃棄。"},{"name":"祟り憑き","big":"img/l/tatari_tsuki.jpg","meta":"\u003cspan class=\"tag t-power\">パワー\u003c/span>\u003cspan class=\"tag\">コスト 1\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"破滅を持つ敵へのアタックが、1ヒットごとにその敵の破滅の1/10\u003cspan class=\"up\">（強化 1/8、切り捨て）\u003c/span>だけ増える。\u003cbr>マルチでは、破滅を使うプレイヤー（蛇の巫女・ネクロバインダー）の人数で割る。"},{"name":"丑の刻参り","big":"img/l/ushi_no_koku_mairi.jpg","meta":"\u003cspan class=\"tag t-attack\">アタック\u003c/span>\u003cspan class=\"tag\">コスト 2\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"2ダメージを与え、破滅 2 を付与する。これを 5\u003cspan class=\"up\">（強化 7）\u003c/span>回行う。"},{"name":"陰陽","big":"img/l/inyou.jpg","meta":"\u003cspan class=\"tag t-power\">パワー\u003c/span>\u003cspan class=\"tag\">コスト 1\u003cspan class=\"up\">（強化 0）\u003c/span>\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"破滅を持つ敵が毒でHPを失うたび、失った量の半分（切り捨て）の破滅を得る。"},{"name":"呪毒一体","big":"img/l/judoku_ittai.jpg","meta":"\u003cspan class=\"tag t-power\">パワー\u003c/span>\u003cspan class=\"tag\">コスト 3\u003cspan class=\"up\">（強化 2）\u003c/span>\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"毒と破滅の両方を持つ敵は、毒と破滅の合計がHP以上になった瞬間、破滅で倒れる。"},{"name":"毒杯の儀","big":"img/l/dokuhai_no_gi.jpg","meta":"\u003cspan class=\"tag t-power\">パワー\u003c/span>\u003cspan class=\"tag\">コスト 2\u003cspan class=\"up\">（強化 1）\u003c/span>\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"ターン開始時、エナジー1を得て、カードを1枚多く引き、自分に毒 3 を付与する。\u003cbr>自分が毒で失うHPは半分になる。\u003cbr>自分の毒が発動するたび、すべての敵に自分の毒と同じ量の毒を付与する。"},{"name":"群蛇乱牙","big":"img/l/gunjaranga.jpg","meta":"\u003cspan class=\"tag t-attack\">アタック\u003c/span>\u003cspan class=\"tag\">コスト 2\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"7ダメージを与え、5ブロックを得る。\u003cbr>手札に噛みつきと舌先を1枚ずつ加える（強化で、強化済みのものを加える）。\u003cbr>エセリアル。"},{"name":"双頭","big":"img/l/twin_head.jpg","meta":"\u003cspan class=\"tag t-power\">パワー\u003c/span>\u003cspan class=\"tag\">コスト 2\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"現在のHPの3分の1\u003cspan class=\"up\">（強化 4分の1、切り捨て）\u003c/span>を失う。\u003cbr>毎ターン、最初にプレイする毒を付与するカードと、破滅を付与するカードが、それぞれもう1回発動する。"},{"name":"神降ろし","big":"img/l/kamioroshi.jpg","meta":"\u003cspan class=\"tag t-skill\">スキル\u003c/span>\u003cspan class=\"tag\">コスト 1\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"このターン、毒か破滅を付与するカードのコストがすべて0になる。\u003cbr>カードを 1\u003cspan class=\"up\">（強化 2）\u003c/span>枚引く。廃棄。"},{"name":"千手の舞","big":"img/l/thousand_hands.jpg","meta":"\u003cspan class=\"tag t-power\">パワー\u003c/span>\u003cspan class=\"tag\">コスト 1\u003cspan class=\"up\">（強化 0）\u003c/span>\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"コスト0のカードをプレイするたび、カードを1枚引く（1ターン3回まで）。"},{"name":"祟り神","big":"img/l/tatari_god.jpg","meta":"\u003cspan class=\"tag t-power\">パワー\u003c/span>\u003cspan class=\"tag\">コスト 3\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"ターン開始時、すべての敵に破滅 8\u003cspan class=\"up\">（強化 11）\u003c/span>を付与する。\u003cbr>バッファー 1 を得る。"},{"name":"大祈祷","big":"img/l/great_prayer.jpg","meta":"\u003cspan class=\"tag t-skill\">スキル\u003c/span>\u003cspan class=\"tag\">コスト 2\u003c/span>\u003cspan class=\"note\">レア\u003c/span>","fx":"7\u003cspan class=\"up\">（強化 9）\u003c/span>ブロックを得る。\u003cbr>山札のカードを2枚選んで廃棄する。"},{"name":"大祟り","big":"img/l/great_tatari.jpg","meta":"\u003cspan class=\"tag t-skill\">スキル\u003c/span>\u003cspan class=\"tag\">コスト 1\u003c/span>\u003cspan class=\"note\">エンシェント\u003c/span>","fx":"破滅 7\u003cspan class=\"up\">（強化 9）\u003c/span>を3回付与する。\u003cbr>天賦。"},{"name":"八岐大蛇","big":"img/l/yamata.jpg","meta":"\u003cspan class=\"tag t-attack\">アタック\u003c/span>\u003cspan class=\"tag\">コスト 1\u003c/span>\u003cspan class=\"note\">エンシェント\u003c/span>","fx":"敵1体に2\u003cspan class=\"up\">（強化 3）\u003c/span>ダメージを与え、毒 1 を付与する。これを 8 回行う。\u003cbr>（毒蛇が「古びた歯」で変化するカード）"}];
(function(){
  var st={r:"all",t:"all",q:""};
  var cards=[].slice.call(document.querySelectorAll(".card"));
  var secs=[].slice.call(document.querySelectorAll(".sec"));
  function apply(){
    var n=0,q=st.q.trim();
    cards.forEach(function(c){
      var ok=(st.r==="all"||c.dataset.rarity===st.r)&&(st.t==="all"||c.dataset.type===st.t)&&(!q||c.dataset.name.indexOf(q)>=0||c.dataset.text.indexOf(q)>=0);
      c.hidden=!ok; if(ok)n++;
    });
    secs.forEach(function(s){s.hidden=!s.querySelector(".card:not([hidden])");});
    document.getElementById("shown").textContent=n+"枚";
  }
  function bind(id,key){
    var g=document.getElementById(id);
    g.addEventListener("click",function(e){
      var b=e.target.closest("button"); if(!b)return;
      st[key]=b.dataset.v;
      [].forEach.call(g.querySelectorAll("button"),function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});
      apply();
    });
  }
  bind("fr","r"); bind("ft","t");
  document.getElementById("q").addEventListener("input",function(e){st.q=e.target.value;apply();});
  apply();

  var dlg=document.getElementById("dlg"),cur=-1;
  function visible(){return cards.filter(function(c){return !c.hidden;});}
  function show(btn){
    var d=CARDS[+btn.dataset.i]; cur=visible().indexOf(btn);
    var im=document.getElementById("dimg"); im.hidden=!d.big; if(d.big)im.src=d.big;
    document.getElementById("dname").textContent=d.name;
    document.getElementById("dmeta").innerHTML=d.meta;
    document.getElementById("dfx").innerHTML=d.fx;
    if(!dlg.open)dlg.showModal();
  }
  function step(k){var v=visible(); if(!v.length)return; show(v[(cur+k+v.length)%v.length]);}
  cards.forEach(function(c){c.addEventListener("click",function(){show(c);});});
  document.getElementById("dprev").addEventListener("click",function(){step(-1);});
  document.getElementById("dnext").addEventListener("click",function(){step(1);});
  document.getElementById("dclose").addEventListener("click",function(){dlg.close();});
  dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close();});
  dlg.addEventListener("keydown",function(e){if(e.key==="ArrowLeft")step(-1);else if(e.key==="ArrowRight")step(1);});
})();
</script>
